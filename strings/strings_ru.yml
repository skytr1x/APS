# диалоги сдк
setup_title: "Another Plugin System требует настройки"
setup_message: "Для корректной работы плагина нужно установить APS SDK. Вы можете пропустить этот шаг, установив его позже в настройках, но плагины, написанные под APS, не будут работать до установки SDK."
update_title: "Обновить APS SDK?"
install_message: "SDK будет загружен с GitHub (ветка main), после чего будут проверены его структура, версия ABI и среда выполнения WASM. SDK содержит Python-код, который выполняется внутри клиента. Подлинность по подписи или хешу не проверяется: установщик доверяет содержимому ветки."
remove_title: "Удалить APS SDK?"
remove_message: "APS-плагины будут отключены и не смогут работать до повторной установки SDK. Файлы плагинов и их настройки сохранятся."
